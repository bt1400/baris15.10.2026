name: APK Olustur
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Sabit imza anahtarini yerlestir (guncellemede veri silinmesin)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: TAM surum (bildirim, parmak izi, konum, dosyadan yukleme)
        id: full
        continue-on-error: true
        run: |
          flutter create --platforms=android --org com.benim --project-name dosya_programi build_full
          cp pubspec_full.yaml build_full/pubspec.yaml
          rm -rf build_full/lib build_full/assets
          cp -r lib build_full/lib
          cp native_full/native.dart build_full/lib/native.dart
          cp -r assets build_full/assets
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android_icons/mipmap-$d/ic_launcher.png build_full/android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          rm -rf build_full/android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's/android:label="[^"]*"/android:label="İş Takip"/' build_full/android/app/src/main/AndroidManifest.xml
          python3 tools/patch_android.py build_full
          cd build_full
          flutter pub get
          flutter build apk --release
      - name: Tam surum APK'sini hazirla
        if: steps.full.outcome == 'success'
        run: |
          mkdir -p cikti
          cp build_full/build/app/outputs/flutter-apk/app-release.apk cikti/app-release.apk
          echo "### TAM surum derlendi (bildirim, parmak izi, konum, dosyadan yukleme var)" >> $GITHUB_STEP_SUMMARY
      - name: TEMEL surum (tam surum derlenemezse)
        if: steps.full.outcome != 'success'
        run: |
          flutter create --platforms=android --org com.benim --project-name dosya_programi build_lite
          cp pubspec.yaml build_lite/pubspec.yaml
          rm -rf build_lite/lib build_lite/assets
          cp -r lib build_lite/lib
          cp -r assets build_lite/assets
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android_icons/mipmap-$d/ic_launcher.png build_lite/android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          rm -rf build_lite/android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's/android:label="[^"]*"/android:label="İş Takip"/' build_lite/android/app/src/main/AndroidManifest.xml
          cd build_lite
          flutter pub get
          flutter build apk --release
          mkdir -p ../cikti
          cp build/app/outputs/flutter-apk/app-release.apk ../cikti/app-release.apk
          echo "### TEMEL surum derlendi (tam surum derlenemedi: bildirim, parmak izi, konum ve dosyadan yukleme YOK)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: dosya-programi-apk
          path: cikti/app-release.apk
